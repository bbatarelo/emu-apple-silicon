name: Project website
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-site.py', 'VERSION', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'scripts/build-site.py', 'VERSION', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build-site.py --url "${SITE_URL:-https://bbatarelo.github.io/emu-apple-silicon}"
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
